# Небольшая сверточная сеть: 3 блока conv-BN-ReLU-maxpool и MLP-классификатор.
experiment_name: cifar10-simple-cnn
run_name: cnn-lr0.001-bs128-seed42
seed: 42
device: auto              # cuda, если доступна, иначе cpu

data:
  s3_path: processed/cifar10/v1
  max_train_samples: null # можно ограничить train для быстрых экспериментов
  augment: false          # random crop (padding 4) + горизонтальный flip

model:
  type: simple_cnn        # linear | simple_cnn | torchvision.<имя>, например torchvision.resnet18
  params:
    channels: [32, 64, 128]
    fc_hidden: 256
    dropout: 0.3
    batch_norm: true

train:
  epochs: 20
  batch_size: 128
  lr: 0.001
  optimizer: adam         # adam | adamw | sgd
  weight_decay: 0.0001
  scheduler: cosine       # none | cosine
