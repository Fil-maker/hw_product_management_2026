# Финальная проверка выбранной по сетке конфигурации (cnn-lr0.001-bs64-augfalse)
# на полном train (40 000 картинок) и полной длине обучения, 20 эпох.
# Аугментация на 10 эпохах проигрывала, на длинном обучении сравниваем ещё раз — по val.
base: configs/simple_cnn.yaml
run_name: "final-cnn-lr{train.lr}-bs{train.batch_size}-aug{data.augment}-ep{train.epochs}"
fixed:
  experiment_name: cifar10-simple-cnn-final
  train.lr: 0.001
  train.batch_size: 64
  train.epochs: 20
grid:
  data.augment: [false, true]
