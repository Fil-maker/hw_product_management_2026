[project]
name = "hw-product-management-2026"
version = "0.1.0"
description = "CIFAR-10: versioned data pipeline in S3 and tracked training experiments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Filipp Zubarev", email = "zubareff10@gmail.com" }]
dependencies = [
    "boto3>=1.40.0",
    "numpy>=2.2.0",
    "pillow>=11.0.0",
    "python-dotenv>=1.1.0",
    "requests>=2.32.0",
    "omegaconf>=2.3.0",
    "matplotlib>=3.10.0",
    # Клиент MLflow без серверной части; версия совпадает с образом сервера.
    "mlflow-skinny==3.17.2",
]

# Сборка PyTorch выбирается явно: `cpu` (по умолчанию) или `gpu` (CUDA 13.2).
[project.optional-dependencies]
cpu = ["torch==2.15.0", "torchvision==0.29.2"]
gpu = ["torch==2.15.0", "torchvision==0.29.2"]
# Экспорт модели в ONNX и его проверка (make export).
export = ["onnx>=1.19.0", "onnxruntime>=1.23.0", "onnxscript>=0.5.0"]
# HTTP-обёртка над Triton; ставится в свой образ без PyTorch.
serve = ["fastapi>=0.120.0", "uvicorn>=0.38.0", "python-multipart>=0.0.20", "tritonclient[http]==2.74.0"]

[project.scripts]
cifar-ingest = "hw_product_management_2026.data.ingest:main"
cifar-download = "hw_product_management_2026.data.download:main"
cifar-convert = "hw_product_management_2026.data.convert:main"
cifar-split = "hw_product_management_2026.data.split:main"
cifar-stats = "hw_product_management_2026.data.stats:main"
cifar-upload = "hw_product_management_2026.data.upload:main"
cifar-train = "hw_product_management_2026.training.train:main"
cifar-grid = "hw_product_management_2026.training.grid:main"
cifar-export = "hw_product_management_2026.serving.export:main"
cifar-verify = "hw_product_management_2026.serving.verify:main"
cifar-load-test = "hw_product_management_2026.serving.load_test:main"

[dependency-groups]
dev = [
    # Версии ruff и mypy закреплены точно: pre-commit запускает их же через `uv run`.
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pre-commit>=4.1.0",
    "boto3-stubs[s3]>=1.40.0",
    "types-requests>=2.32.0",
]

[tool.uv]
package = true
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "gpu" },
]

[tool.ruff]
line-length = 99
target-version = "py312"
src = ["src"]
exclude = [
    ".venv",
    "__pycache__",
    ".mypy_cache",
    ".ruff_cache",
    "hw",  # условия заданий: не код проекта, а ruff форматирует и примеры в Markdown
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Таблицы и отчёты этих скриптов — на русском: кириллица в них не опечатка.
"src/hw_product_management_2026/serving/verify.py" = ["RUF001"]
"src/hw_product_management_2026/serving/load_test.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
exclude = [
    "__pycache__",
    "\\.venv",
    "\\.mypy_cache",
    "^data/",
]

# Послабление только для сторонних библиотек без аннотаций — на собственный код
# (hw_product_management_2026.*) оно не распространяется.
[[tool.mypy.overrides]]
module = [
    "botocore.*",
    "boto3.*",
    "omegaconf.*",
    "mlflow.*",
    "torchvision.*",
    "onnx.*",
    "onnxruntime.*",
    "tritonclient.*",
]
ignore_missing_imports = true
