# Хуки запускают ruff и mypy из окружения проекта (`uv run`), поэтому их версии
# всегда совпадают с зафиксированными в pyproject.toml / uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (lint)
        entry: uv run ruff check
        language: system
        types: [python]

      - id: ruff-format
        name: ruff format --check (style)
        entry: uv run ruff format --check
        language: system
        types: [python]

      - id: mypy
        name: mypy (types)
        entry: uv run mypy src/
        language: system
        types: [python]
        pass_filenames: false
